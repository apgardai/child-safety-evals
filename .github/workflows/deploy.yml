name: Build and deploy child-safety-evals server

on:
  push:
    branches:
      - main
    paths:
      # Monorepo (e.g. apgard): server lives under child-safety-evals/server
      - "child-safety-evals/server/**"
      - "child-safety-evals/.github/workflows/deploy.yml"
      # Standalone child-safety-evals repo: server at repo root server/
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: child_safety_evals
  COMPOSE_PROJECT: cse
  EC2_DEPLOY_DIR: /home/ubuntu/child-safety-evals

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EC2_USER: ubuntu
      IMAGE_PREFIX: prod
      SSH_OPTS: >-
        -o StrictHostKeyChecking=no
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve server directory (monorepo vs standalone repo)
        run: |
          if [ -d child-safety-evals/server ]; then
            echo "CSE_SERVER_ROOT=child-safety-evals/server" >> "$GITHUB_ENV"
            echo "Using monorepo path: child-safety-evals/server"
          elif [ -d server ]; then
            echo "CSE_SERVER_ROOT=server" >> "$GITHUB_ENV"
            echo "Using standalone repo path: server"
          else
            echo "Expected child-safety-evals/server (monorepo) or server/ (standalone)."
            ls -la
            exit 1
          fi

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          set -e
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_BASE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"

          cd "${CSE_SERVER_ROOT}"
          docker build -t "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}" .
          docker tag "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}" "${IMAGE_BASE}:${IMAGE_PREFIX}-latest"

          docker push "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:${IMAGE_PREFIX}-latest"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE_TAG=${IMAGE_PREFIX}-${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          echo "${{ secrets.CSE_EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Ensure deploy directory on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "mkdir -p ${{ env.EC2_DEPLOY_DIR }}"

      - name: Sync docker-compose.yml
        run: |
          scp $SSH_OPTS -i key.pem "${CSE_SERVER_ROOT}/docker-compose.yml" \
            ${EC2_USER}@${{ secrets.CSE_EC2_HOST }}:${{ env.EC2_DEPLOY_DIR }}/

      - name: Create env file (local) and upload
        run: |
          set -e
          {
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
            echo "DATABASE_URL=${{ secrets.CSE_DATABASE_URL }}"
            echo "CSE_SECRETS_KEY=${{ secrets.CSE_SECRETS_KEY }}"
            echo "INTERNAL_API_SECRET=${{ secrets.CSE_INTERNAL_API_SECRET }}"
            echo "CORS_ORIGINS=${{ secrets.CSE_CORS_ORIGINS }}"
            echo "FIREBASE_CREDS_PATH=/app/firebase-credentials.json"
            echo "GMAIL_EMAIL=${{ secrets.GMAIL_EMAIL }}"
            echo "GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}"
          } > /tmp/cse-server.env
          chmod 600 /tmp/cse-server.env
          scp $SSH_OPTS -i key.pem /tmp/cse-server.env \
            ${EC2_USER}@${{ secrets.CSE_EC2_HOST }}:${{ env.EC2_DEPLOY_DIR }}/.env
          rm -f /tmp/cse-server.env

      - name: Upload Firebase credentials on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} << EOF
            set -e
            cd ${{ env.EC2_DEPLOY_DIR }}
            echo "${{ secrets.CSE_FIREBASE_CREDS_B64 }}" | base64 -d > firebase-credentials.json
            chmod 600 firebase-credentials.json
          EOF

      - name: Pull new image on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_PREFIX }}-${{ env.IMAGE_TAG }}"

      - name: Deploy containers
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << EOF
            set -e
            cd ${{ env.EC2_DEPLOY_DIR }}
            export IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${{ env.IMAGE_TAG }}"
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            docker compose -p ${{ env.COMPOSE_PROJECT }} down
            docker compose -p ${{ env.COMPOSE_PROJECT }} up -d
          EOF

      - name: Health check
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << 'EOF'
            set -e
            echo "Waiting for API..."
            HEALTH_URL="http://127.0.0.1:8000/internal/health"
            MAX_ATTEMPTS=30
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "Health check passed."
                exit 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
              sleep 2
            done
            echo "Health check failed."
            exit 1
          EOF

      - name: Show logs on failure
        if: failure()
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "cd ${{ env.EC2_DEPLOY_DIR }} && docker compose -p ${{ env.COMPOSE_PROJECT }} logs --tail=100" || true

      - name: Cleanup old images
        if: success()
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << EOF
            docker images "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}" --format "{{.Tag}}" | \
              grep "^${{ env.IMAGE_PREFIX }}-" | \
              sort -r | tail -n +6 | \
              xargs -r -I {} docker rmi "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:{}" 2>/dev/null || true
          EOF
