name: Build and deploy child-safety-evals server

on:
  push:
    branches:
      - main
    paths:
      # Monorepo (e.g. apgard): server lives under child-safety-evals/server
      - "child-safety-evals/server/**"
      - "child-safety-evals/benchmark/data/**"
      - "child-safety-evals/benchmark/models.json"
      - "child-safety-evals/benchmark/package.json"
      - "child-safety-evals/benchmark/yarn.lock"
      - "child-safety-evals/benchmark/.yarnrc.yml"
      - "child-safety-evals/benchmark/.yarn/**"
      - "child-safety-evals/benchmark/packages/**"
      - "child-safety-evals/benchmark/tsconfig*.json"
      - "child-safety-evals/server/Dockerfile"
      - "child-safety-evals/.github/workflows/deploy.yml"
      # Standalone child-safety-evals repo: server at repo root server/
      - "server/**"
      - "benchmark/data/**"
      - "benchmark/models.json"
      - "benchmark/package.json"
      - "benchmark/yarn.lock"
      - "benchmark/.yarnrc.yml"
      - "benchmark/.yarn/**"
      - "benchmark/packages/**"
      - "benchmark/tsconfig*.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: child_safety_evals
  COMPOSE_PROJECT: cse
  EC2_DEPLOY_DIR: /home/ubuntu/child-safety-evals

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EC2_USER: ubuntu
      IMAGE_PREFIX: prod
      SSH_OPTS: >-
        -o StrictHostKeyChecking=no
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # benchmark/ is a submodule (apgardai/benchmark); without this, rsync ships no model-results.
          submodules: recursive

      - name: Resolve server directory (monorepo vs standalone repo)
        run: |
          if [ -d child-safety-evals/server ]; then
            echo "CSE_SERVER_ROOT=child-safety-evals/server" >> "$GITHUB_ENV"
            echo "CSE_ROOT=child-safety-evals" >> "$GITHUB_ENV"
            echo "Using monorepo path: child-safety-evals/server"
          elif [ -d server ]; then
            echo "CSE_SERVER_ROOT=server" >> "$GITHUB_ENV"
            echo "CSE_ROOT=." >> "$GITHUB_ENV"
            echo "Using standalone repo path: server"
          else
            echo "Expected child-safety-evals/server (monorepo) or server/ (standalone)."
            ls -la
            exit 1
          fi

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          set -e
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_BASE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"
          CSE_ROOT="$(dirname "${CSE_SERVER_ROOT}")"
          docker build \
            -f "${CSE_SERVER_ROOT}/Dockerfile" \
            -t "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}" \
            "${CSE_ROOT}"
          docker tag "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}" "${IMAGE_BASE}:${IMAGE_PREFIX}-latest"

          docker push "${IMAGE_BASE}:${IMAGE_PREFIX}-${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:${IMAGE_PREFIX}-latest"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE_TAG=${IMAGE_PREFIX}-${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          echo "${{ secrets.CSE_EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Ensure deploy directory on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "mkdir -p ${{ env.EC2_DEPLOY_DIR }}"

      - name: Sync docker-compose.yml
        run: |
          scp $SSH_OPTS -i key.pem "${CSE_SERVER_ROOT}/docker-compose.yml" \
            ${EC2_USER}@${{ secrets.CSE_EC2_HOST }}:${{ env.EC2_DEPLOY_DIR }}/

      - name: Check benchmark data is in git checkout
        run: |
          set -e
          SCOUT_JSON="${CSE_ROOT}/benchmark/data/model-results/llama-4-scout/results.json"
          if [ ! -f "$SCOUT_JSON" ]; then
            echo "::error::benchmark/data/model-results/ is not in this commit (gitignored or not added)."
            echo "Force-add and push before deploy, e.g.:"
            echo "  git add -f benchmark/data/model-results/ benchmark/data/scenarioSeeds.jsonl benchmark/data/scenarios.jsonl"
            exit 1
          fi
          test -f "${CSE_ROOT}/benchmark/models.json"

      - name: Sync benchmark assets to EC2
        run: |
          set -e
          # Do not use --delete on the full tree: gitignored / runtime paths on EC2 must survive.
          rsync -az \
            -e "ssh $SSH_OPTS -i key.pem" \
            --exclude node_modules \
            --exclude .yarn \
            --exclude 'packages/cli/build' \
            --exclude 'packages/benchmark/build' \
            --exclude 'data/.benchmark-expand-tmp' \
            --exclude 'data/.benchmark-run-tmp' \
            --exclude 'data/results' \
            --exclude 'data/results.zip' \
            --exclude 'data/results.json' \
            --exclude 'data/scenarioSeeds_kora.jsonl' \
            "${CSE_ROOT}/benchmark/" \
            ${EC2_USER}@${{ secrets.CSE_EC2_HOST }}:${{ env.EC2_DEPLOY_DIR }}/benchmark/

      - name: Prune stale model-results layout on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << 'EOF'
            set -euo pipefail
            MODEL_RESULTS="${{ env.EC2_DEPLOY_DIR }}/benchmark/data/model-results"
            if [ ! -d "$MODEL_RESULTS" ]; then
              echo "No model-results directory on EC2; skip prune."
              exit 0
            fi

            pruned_nested=0
            pruned_staging=0

            for model_dir in "$MODEL_RESULTS"/*/; do
              [ -d "$model_dir" ] || continue
              model_name="$(basename "$model_dir")"
              nested="${model_dir}results"

              if [ -d "$nested" ]; then
                has_root_test_results=false
                if [ -d "${model_dir}testResults" ] && \
                  find "${model_dir}testResults" -maxdepth 1 -name '*.json' -print -quit | grep -q .; then
                  has_root_test_results=true
                fi
                has_root_zip=false
                if [ -f "${model_dir}results.zip" ]; then
                  has_root_zip=true
                fi

                if $has_root_test_results || $has_root_zip; then
                  echo "Pruning stale nested results/ for ${model_name}"
                  rm -rf "$nested"
                  pruned_nested=$((pruned_nested + 1))
                else
                  echo "Keeping nested results/ for ${model_name} (no canonical top-level bundle yet)"
                fi
              fi

              staging="${model_dir}.merge-staging"
              if [ -d "$staging" ]; then
                echo "Pruning stale .merge-staging for ${model_name}"
                rm -rf "$staging"
                pruned_staging=$((pruned_staging + 1))
              fi
            done

            echo "Prune complete: nested_results=${pruned_nested}, merge_staging=${pruned_staging}"
          EOF

      - name: Create env file (local) and upload
        run: |
          set -e
          {
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
            echo "IMAGE_TAG=${{ env.IMAGE_PREFIX }}-${{ env.IMAGE_TAG }}"
            echo "BENCHMARK_HOST_PATH=./benchmark"
            echo "DATABASE_URL=${{ secrets.CSE_DATABASE_URL }}"
            echo "CSE_SECRETS_KEY=${{ secrets.CSE_SECRETS_KEY }}"
            echo "INTERNAL_API_SECRET=${{ secrets.CSE_INTERNAL_API_SECRET }}"
            echo "SESSION_DOMAIN=.apgardai.com"
            echo "CORS_ORIGINS=${{ secrets.CSE_CORS_ORIGINS }}"
            echo "FIREBASE_CREDS_PATH=/app/firebase-credentials.json"
            echo "GMAIL_EMAIL=${{ secrets.GMAIL_EMAIL }}"
            echo "GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}"
            echo "REDIS_BROKER_URL=redis://redis:6379/0"
          } > /tmp/cse-server.env
          chmod 600 /tmp/cse-server.env
          scp $SSH_OPTS -i key.pem /tmp/cse-server.env \
            ${EC2_USER}@${{ secrets.CSE_EC2_HOST }}:${{ env.EC2_DEPLOY_DIR }}/.env
          rm -f /tmp/cse-server.env

      - name: Upload Firebase credentials on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} << EOF
            set -e
            cd ${{ env.EC2_DEPLOY_DIR }}
            echo "${{ secrets.CSE_FIREBASE_CREDS_B64 }}" | base64 -d > firebase-credentials.json
            chmod 600 firebase-credentials.json
          EOF

      - name: Pull new image on EC2
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_PREFIX }}-${{ env.IMAGE_TAG }}"

      - name: Deploy containers
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << EOF
            set -e
            cd ${{ env.EC2_DEPLOY_DIR }}
            docker compose -p ${{ env.COMPOSE_PROJECT }} down
            docker compose -p ${{ env.COMPOSE_PROJECT }} pull
            docker compose -p ${{ env.COMPOSE_PROJECT }} up -d
          EOF

      - name: Health check
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << 'EOF'
            set -e
            echo "Waiting for API..."
            HEALTH_URL="http://127.0.0.1:8000/internal/health"
            MAX_ATTEMPTS=30
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "Health check passed."
                exit 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
              sleep 2
            done
            echo "Health check failed."
            exit 1
          EOF

      - name: Show logs on failure
        if: failure()
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} \
            "cd ${{ env.EC2_DEPLOY_DIR }} && docker compose -p ${{ env.COMPOSE_PROJECT }} logs --tail=100" || true

      - name: Cleanup old images
        if: success()
        run: |
          ssh $SSH_OPTS -i key.pem ${EC2_USER}@${{ secrets.CSE_EC2_HOST }} bash -s << EOF
            docker images "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}" --format "{{.Tag}}" | \
              grep "^${{ env.IMAGE_PREFIX }}-" | \
              sort -r | tail -n +6 | \
              xargs -r -I {} docker rmi "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:{}" 2>/dev/null || true
          EOF
